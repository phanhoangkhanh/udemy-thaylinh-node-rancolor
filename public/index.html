<!doctype html>
<html>
  <head>
    <title>Welcome to My Website</title>
  </head>
  <script>
    function getRandomColor() {
      const letters = "0123456789ABCDEF";
      let color = "#";
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    document.getElementById("welcome").style.color = getRandomColor();
  </script>

  <body>
    <h1 id="welcome">Welcome to My Website 2025/05/29 Github deploy</h1>
    <h1>KHÁNH ĐÃ BIÊN TẬP VÀ TỰ DEPLOY THỬ NHA LẦN 7 + SWITCH COMMIT</h1>
    <p>Thank you for visiting. Enjoy your stay!</p>

    <form action="/api/login" method="POST">
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required /><br /><br />

      <label for="password">Password:</label>
      <input
        type="password"
        id="password"
        name="password"
        required
      /><br /><br />

      <input
        type="button"
        value="Login"
        onclick="window.location.href = '/learning'"
      />
      <input type="reset" value="Reset" />
    </form>
  </body>
</html>
